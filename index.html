<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🍱 公司午餐2.0</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
</head>
<body>
<div class="app">
<header>
  <div>
    <h1>🍱 公司午餐</h1>
    <div id="today" class="muted"></div>
  </div>

  <div class="header-actions">
    <button id="addRestaurantBtn" class="secondary hidden" onclick="openRestaurantForm()">
      ＋ 新增餐廳
    </button>
    <button id="editModeBtn" class="primary" onclick="toggleEditMode()">
      🔐 編輯模式
    </button>
  </div>
</header>

<section class="draw-card">
  <div><div class="draw-title">🎲 今日午餐抽選</div><div id="drawStatus" class="muted">只會從今天有營業的餐廳中抽</div></div>
  <button id="drawBtn" class="draw-button" onclick="drawRestaurant()">🎲 幫我抽！</button>
</section>

<section class="search-card">
  <label>🔎 想吃什麼？</label>
  <input id="search" placeholder="搜尋餐廳、Tag 或小紙條…" oninput="render()">
  <div class="status-filter" role="group" aria-label="餐廳營業狀態篩選">
    <button type="button" class="status-filter-btn active" data-status-filter="all" onclick="setStatusFilter('all')">全部</button>
    <button type="button" class="status-filter-btn" data-status-filter="today" onclick="setStatusFilter('today')">📅 今日營業</button>
    <button type="button" class="status-filter-btn" data-status-filter="now" onclick="setStatusFilter('now')">🟢 現在營業</button>
    <button type="button" class="status-filter-btn" data-status-filter="closing" onclick="setStatusFilter('closing')">⚠️ 30分鐘內打烊</button>
  </div>
</section>

<div id="editBanner" class="edit-banner hidden">✏️ 編輯模式已開啟 <button class="secondary" onclick="lockEditMode()">鎖定</button></div><main>
  <div class="section-title"><h2>餐廳列表</h2><span id="count" class="muted"></span></div>
  <div id="restaurantList" class="grid"><div class="empty">載入中…</div></div>
</main>
</div>

<div id="modal" class="modal hidden"><div class="modal-box"><button class="close" onclick="closeModal()">×</button><div id="modalContent"></div></div></div>
<script src="app.js"></script>
</body></html>
